      properties:
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        property_id: {$ref: '#/components/schemas/Identifier'}
        type:
          type: string
          enum: [turnover, pre_arrival_inspection, restock, incident, routine_maintenance, specialist_vendor_request, property_onboarding, document_review, inventory_count]
        requested_window: {type: object, additionalProperties: true}
        checklist_version_id: {$ref: '#/components/schemas/Identifier'}
        reason: {type: string, minLength: 1, maxLength: 1000}
    AgentRunCreate:
      type: object
      additionalProperties: false
