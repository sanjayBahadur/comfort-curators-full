      properties:
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        run_kind: {type: string, enum: [superhost, hermes]}
        tenant_id: {$ref: '#/components/schemas/Identifier'}
        property_id: {$ref: '#/components/schemas/Identifier'}
        trigger_type: {type: string, maxLength: 64}
        trigger_id: {$ref: '#/components/schemas/Identifier'}
        correlation_id: {$ref: '#/components/schemas/Identifier'}
        purpose: {type: string, maxLength: 500}
    Health:
      type: object
      additionalProperties: false
