    Accepted:
      type: object
      additionalProperties: false
      required: [request_id, status, resource_id]
      properties:
        request_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [accepted, queued]}
        resource_id: {$ref: '#/components/schemas/Identifier'}
    Resource:
      type: object
